<div class="app">
  <app-app-bar
    [title]="title()"
    [menuOpen]="menuRail()"
    (button)="toggleMenu()"
    (titleTouched)="goHome()"
  />
  <app-navigation-bar
    [isShown]="isMobile()"
  />
  <app-menu
    [isMobile]="isMobile()"
    [isOpen]="menuRail()"
  />
  <div class="main-container">
    <router-outlet/>
  </div>
</div>
