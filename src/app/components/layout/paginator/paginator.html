<div class="paginator-wrapper">
  <button
    class="page-btn"
    (click)="onPrev()"

    aria-label="Previous Page">

    <mat-icon class="page-icon">navigate_before</mat-icon>
  </button>

  <button
    class="page-btn"
    (click)="onNext()"
    aria-label="Next Page">
    <mat-icon class="page-icon">navigate_next</mat-icon>

  </button>
</div>
