<mat-card class="card">
  <div class="card-icon">
    <ng-content select="[card-icon]"></ng-content>
  </div>

  <div class="card-content">

    <div class="card-header-row">
      <ng-content select="[card-header-row]"></ng-content>
    </div>

    <div class="card-body-row">
      <ng-content select="[card-body-row]"></ng-content>
    </div>

  </div>
</mat-card>
