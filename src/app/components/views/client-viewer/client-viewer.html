<div class="component">
  <div class="row">

  <app-client-list-manager
    [actions]="true"
    (selectedClient)="openClientDetail($event)"
    (edit)="setCurrentClient($event)"
    (delete)="deleteClient($event)"
  />
  <app-client-form
    #clientForm
    (finalClient)="handleSubmit($event)"
    [clientToEdit]="currentClient()!"
  />
  </div>
</div>
