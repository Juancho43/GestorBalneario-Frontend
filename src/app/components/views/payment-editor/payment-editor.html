<div class="component">
  <h3>Crear nuevo pago</h3>
  <div class="row">
    <div>

      @for (invoice of invoices(); track $index){
        <app-invoice-card
          (click)="selectedInvoice.set(invoice)"
          [invoice]="invoice"
        />
      }
    </div>
    <app-payment-form
      [invoice]="selectedInvoice()"
      (finalPayment)="createPayment($event)"
    />
  </div>
</div>
