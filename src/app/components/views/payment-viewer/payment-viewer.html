<div class="component">
  <h3>Generar reporte de pagos</h3>
  <app-report-form
    [paymentMethods]="paymentMethods()"
    (finalQuery)="query.set($event)"
  />

  @if (report() !== null) {

    <app-payments-table
      [payments]="report()!.payments!"
      (clickedPayment)="openInvoiceDialog($event)"
    />
  }
<!--  <app-paginator/>-->
</div>
