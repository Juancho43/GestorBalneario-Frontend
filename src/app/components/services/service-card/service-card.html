@let service = this.service();
<app-card
  role="button"
>

  <mat-icon aria-hidden="true" fontIcon="info" card-icon />
  <span card-header-row>{{service.name}}</span>
  <div card-body-row>
    <span>Precio: {{service.price | currency}}</span>
    <br>
    <span>{{service.type | serviceType}}</span>
  </div>
</app-card>
