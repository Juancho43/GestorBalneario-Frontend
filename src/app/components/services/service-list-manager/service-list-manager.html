<app-service-searcher
  (finalQuery)="handleSearch($event)"
/>
<app-service-list
  [list]="services()"
  (selected)="selectService($event)"
  (edit)="editService($event)"
  (delete)="deleteService($event)"
/>
<div class="bottom">
  <app-paginator
    [query]="query()"
    (pageChange)="handlePage($event)"
  />
  <app-fab-button
    icon="add"
    label="Nuevo servicio"
    (touched)="create.emit()"
  />
</div>
