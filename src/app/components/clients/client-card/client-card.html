@let client = this.client();
<mat-card class="card client-card">
  <mat-icon aria-hidden="false" fontIcon="person"/>
  <div
    class="data"
    (click)="selected.emit(client)"
  >
    <p>Nombre: {{client.name}}</p>
    <p>Email: {{client.email}}</p>
    <p>Telefono: {{client.phone}}</p>
  </div>
  @if (this.actions()) {
   <app-custom-menu
    (selectedOptionChange)="handleMenuOption($event!)"
    [options]="options"
  />

  }
</mat-card>
