<form (ngSubmit)="submitted()">
  @if (!editMode()){
    <legend>Crear cliente</legend>
  } @else {
    <legend>Editando cliente</legend>
  }
  <label for="name">Nombre:</label>
  <input type="text" [formField]="clientForm.name"/>
  <label for="email">Email:</label>
  <input type="email" [formField]="clientForm.email" />
  <label for="phone">Télefono:</label>
  <input type="tel" [formField]="clientForm.phone"/>

  @if(clientForm().touched()){
    @for(error of allFormErrors(); track $index){
      <p class="error">{{error.message}}</p>
    }
  }
  @if (!editMode()){
    <input type="submit" value="Crear cliente" />
  } @else {
    <input type="submit" value="Actualizar cliente" />
  }
  <input type="reset" (click)="editMode.set(false)" value="Cancelar" />
</form>
