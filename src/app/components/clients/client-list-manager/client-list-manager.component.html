<app-client-searcher
  (finalQuery)="handleSearch($event)"
/>
<app-client-list
  [scrollable]="actions()"
  [list]="list()"
  (selected)="selectClient($event)"
  (edit)="editClient($event)"
  (delete)="deleteClient($event)"
/>
<div class="bottom">
  <app-paginator
    (pageChange)="handlePage($event)"
    [query]="query()"
  />
  @if (!actions()){
    <app-fab-button
      icon="add"
      label="Nuevo cliente"
      (touched)="create.emit()"
    />
  }
</div>
