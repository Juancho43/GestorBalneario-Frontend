@let list = this.list();
@for (client of list; track client.id) {
  <div class="client-card">
    <app-client-card
      [actions]="this.actions()"
      (delete)="delete.emit(client)"
      (edit)="edit.emit(client)"
      [client]="client"
      (selected)="selected.emit(client)"
    />
  </div>
} @empty {
  <p>No clients found.</p>
}
