<app-search-bar>
  <input
    search-input
    type="text"
    name='seachTerm'
    [(ngModel)]="searchTerm"
    placeholder="Buscar por nombre o correo"
  />
  <app-filter-button
    search-filter
    (pressed)="handleFilter()"
  />
  <button
    search-button
    (click)="submitHandler()"
    type="submit">
    <mat-icon fontIcon="search"/>
  </button>
</app-search-bar>
