@let data= this.clientData();
@if (data !== undefined) {
  @let client = data.client;
  @let invoices = data.invoices;
  <div class="detail-container">
    <div class="detail" animate.enter="enter-animation">
      <app-client-card [client]="client"/>
      <h4>Facturas</h4>
      @for (invoice of invoices; track $index) {
        <app-invoice-card [invoice]="invoice" />
      } @empty {
        <p>No hay facturas para este cliente</p>
      }
    </div>
  </div>
}
