@let data = this.shadowData();

@if (data !== undefined) {
  @let shadow = data.shadow;
  @let reservations = data.reservations;
  <div
    class="detail"
    animate.enter="enter-animation"
  >
    <app-shadow-card [shadow]="shadow"/>
    <p>Reservas historicas</p>
    @for (reservation of reservations; track $index) {
      <app-reservation-card
        [reservation]="reservation"
      />
    } @empty {
      <p>No hay reservas para esta {{shadow.type}}.</p>
    }
  </div>
}
