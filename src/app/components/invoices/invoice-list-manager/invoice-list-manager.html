<app-invoice-searcher
  (finalQuery)="handleSearch($event)"
/>
<app-invoice-list
  [list]="invoices()"
  (selected)="selectedInvoice.emit($event)"
  (edit)="editInvoice($event)"
  (delete)="deleteInvoice($event)"
/>
<div class="bottom">
  <app-paginator
    (pageChange)="handlePage($event)"
    [query]="query()"
  />
</div>
