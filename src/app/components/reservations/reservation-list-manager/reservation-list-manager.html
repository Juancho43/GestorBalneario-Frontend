<app-reservation-searcher
  (finalQuery)="handleSearch($event)"
/>
<app-reservation-list
  [list]="list()"
  (selectedReservation)="selectReservation($event)"
  (edit)="editReservation($event)"
  (delete)="deleteReservation($event)"
/>
<div class="bottom">
  <app-paginator
    (pageChange)="handlePage($event)"
    [query]="query()"
  />
  <app-fab-button
    icon="add"
    label="Crear reserva"
    (touched)="create.emit()"
  />
</div>
