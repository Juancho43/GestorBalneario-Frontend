<div class="search">
  <form
    (ngSubmit)="submitHandler()"
  >
    <input
      type="text"
      name='seachTerm'
      [(ngModel)]="searchTerm"
      placeholder="Buscar por nombre o correo"
    />
    <app-filter-button
      (pressed)="handleFilter()"
    />
    <button type="submit">
      <mat-icon fontIcon="search"/>
    </button>
  </form>
</div>
