<app-season-searcher
  (finalQuery)="handleSearch($event)"
/>
<app-season-list
  [list]="seasonList()"
  (selected)="select($event)"
  (edit)="editSeason($event)"
  (delete)="deleteSeason($event)"
/>

<div class="bottom">
  <app-paginator
    [query]="query()"
    (pageChange)="handlePage($event)"
  />

  <app-fab-button
    icon="add"
    label="Nueva temporada"
    (touched)="create.emit()"
  />
</div>
