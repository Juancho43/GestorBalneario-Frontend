<div class="dialog">
  <section class="header">
    <div class="headline">
      <mat-icon class="filter-icon">date_range</mat-icon>
      <h3>Formulario temporada</h3>
    </div>
    <mat-icon class="close-icon" (click)="close()">close</mat-icon>
  </section>
  @if(season() !== undefined){
    <app-season-form
      class="form"
      [seasonToEdit]="season()"
      (finalSeason)="handleSubmit($event)"
    />
  }
</div>
