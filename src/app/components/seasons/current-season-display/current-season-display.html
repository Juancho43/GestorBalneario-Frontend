@if(this.season()){
  @let season = this.season();
  <div
    #overlayOrigin
    [class.active]="!season.isActive"
    (click)="openSwicher()"
  >
    @if(this.season()!){
      @let season = this.season();
      <h2>{{season.name}}</h2>
      @if (!this.season().isActive){
        Temporada historica
      }
    }
  </div>
}
