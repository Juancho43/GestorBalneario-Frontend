@let season = this.season();
<app-card
  role="button"
>
  <mat-icon aria-hidden="true" fontIcon="date_range" card-icon />
  <span card-header-row>{{season.name}}</span>
  <div card-body-row>
    <span>Inicio: {{season.startDate | date}}</span>
    <br>
    <span>Fin: {{season.endDate | date}}</span>
  </div>
</app-card>
