<form (ngSubmit)="submitPayment()">
  @if (editMode()) {
    <legend>Editar pago</legend>
  } @else {
    <legend>Crear pago</legend>
  }
  <label>Fecha</label>
  <input type="date" [formField]="paymentForm.date"/>
  <label>Monto</label>
  <input type="number" [formField]="paymentForm.amount"/>
  <label>Descripcion</label>
  <input type="text" [formField]="paymentForm.description!"/>
  <label>Tipo de pago</label>
  <select [formField]="paymentForm.type">
    @for (method of paymentMethods();track $index){
      <option [value]="method"> {{method|paymentType}}</option>
    }
  </select>
  <label>Cambio</label>
  <input type="number" [formField]="paymentForm.changeType"/>
  <label>Factura</label>
  <input type="text" [value]="payment().invoiceId!" readonly/>
  <label>Total:</label>
  <p>{{total() | currency}}</p>
  @if(paymentForm().touched()){
    @for(error of allFormErrors(); track $index){
      <p class="error">{{error.message}}</p>
    }
  }
  @if (editMode()) {
    <input type="submit" value="Actualizar">
  } @else {
    <input type="submit" value="Crear">
  }
  <input type="reset" value="Cancelar" (click)="editMode.set(false)">
</form>
