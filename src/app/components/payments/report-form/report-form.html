<form (ngSubmit)="submittedForm()">
  <label>Fechas</label>
  <input type="date" [formField]="queryForm.start">
  <input type="date" [formField]="queryForm.end">
  <label>Tipo de pago</label>
  <select [formField]="queryForm.type">
    <option value="ALL">Todos</option>
    @for (method of paymentMethods();track $index){
      <option [value]="method"> {{method|paymentType}}</option>
    }
  </select>
  <button type="submit">Enviar</button>
</form>
